<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview</title>
</head>
<body>
    <iframe id="previewIframe" src="" style="width: 100%; height: 500px;" frameborder="0"></iframe>
    <script>
        let debounceTimer;

        function renderPreview(content) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                try {
                    const iframe = document.getElementById('previewIframe');
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    if (!doc) throw new Error('Unable to access iframe document');

                    doc.open();
                    doc.write(content);
                    doc.close();
                } catch (error) {
                    console.error('Error rendering preview:', error);
                    // Fallback handling can be added here
                }
            }, 300);
        }

        // Example: Call renderPreview with some HTML content
        renderPreview('<h1>Hello, World!</h1>');
    </script>
</body>
</html>
