<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>محرر أكواد مباشر - Live Code Editor Pro | HTML, CSS, JS أونلاين</title>
    <meta name="description" content="محرر أكواد مباشر مجاني مع إبراز بناء الجملة، حفظ تلقائي، وتحميل المشاريع. جرب HTML، CSS، JavaScript فوراً في المتصفح.">
    <meta name="keywords" content="محرر أكواد, HTML editor, CSS editor, JavaScript editor, live code editor, online editor, syntax highlighting">
    <meta name="author" content="Code Bro">
    <meta name="robots" content="index, follow">
    
    <!-- بيانات منظمة (Structured Data) لتحسين ظهور الموقع في البحث -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Live Code Editor Pro",
      "description": "محرر أكواد مباشر مع إبراز بناء الجملة وحفظ تلقائي ودعم HTML/CSS/JS.",
      "url": "https://code-bro1.netlify.app/",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    
    <!-- Tailwind + Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <!-- Modes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/display/autorefresh.min.js"></script>
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Cairo', sans-serif; overflow: hidden; background: #111827; }
        .CodeMirror { height: 100%; font-size: 13px; line-height: 1.5; }
        .editor-panel { display: flex; flex-direction: column; background: #1e1e2e; overflow: hidden; }
        .editor-header {
            background: #111827;
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #2d3748;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 5;
        }
        .editor-label { font-size: 0.85rem; font-weight: 600; color: #e2e8f0; display: flex; align-items: center; gap: 6px; }
        .editor-label span:first-child { background: #1f2937; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
        .cm-s-material-darker .CodeMirror-gutters { background-color: #21212e; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 20px; }
        .toolbar-btn {
            background: #2d3748; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem;
            font-weight: 500; transition: all 0.2s; display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
        }
        .toolbar-btn:hover { background: #4a5568; transform: translateY(-1px); }
        .toast-msg {
            position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: #a5f3fc;
            padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; z-index: 1000;
            opacity: 0; transition: opacity 0.2s; pointer-events: none; backdrop-filter: blur(8px);
            border-left: 3px solid #3b82f6;
        }
        .action-buttons { display: flex; gap: 8px; align-items: center; }
        .clear-btn.disabled-clear { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
        .editor-container { flex: 1; min-height: 0; position: relative; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 flex flex-col h-screen overflow-hidden">

    <header class="px-4 py-2 bg-gray-800 border-b border-gray-700 flex items-center justify-between shadow-md z-10 flex-shrink-0 h-14">
        <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-blue-400"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.72"></path></svg>
            <h1 class="text-xl font-bold tracking-tight" data-lang-key="title">Live Code Editor Pro</h1>
        </div>
        <div class="flex items-center gap-3">
            <button id="download-html-btn" class="toolbar-btn text-green-300" data-lang-key="downloadHtmlBtn">⬇️ Download HTML</button>
            <button id="download-zip-btn" class="toolbar-btn text-blue-300" data-lang-key="downloadZipBtn">⬇️ Download ZIP</button>
            <select id="language-switcher" class="bg-gray-700 text-white rounded-md px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="en">🇬🇧 English</option><option value="ar">🇸🇦 العربية</option><option value="fr">🇫🇷 Français</option>
                <option value="es">🇪🇸 Español</option><option value="pt">🇵🇹 Português</option><option value="it">🇮🇹 Italiano</option>
            </select>
        </div>
    </header>

    <main class="flex-grow grid grid-rows-[1fr_2fr] gap-1 bg-gray-700 overflow-hidden">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-1 overflow-hidden">
            <!-- HTML Panel -->
            <div class="editor-panel bg-gray-800 rounded-sm">
                <div class="editor-header">
                    <div class="editor-label"><span class="text-blue-400">&lt;/&gt;</span><span data-lang-key="htmlLabel">HTML</span></div>
                    <div class="action-buttons">
                        <button class="copy-btn" data-target="html" data-lang-key="copyBtn">📋 Copy</button>
                        <button class="clear-btn" data-editor="html" data-lang-key="clearButton">Clear</button>
                    </div>
                </div>
                <div class="editor-container"><textarea id="html-code" class="hidden"></textarea></div>
            </div>
            <!-- CSS Panel -->
            <div class="editor-panel bg-gray-800 rounded-sm">
                <div class="editor-header">
                    <div class="editor-label"><span class="text-purple-400">{ }</span><span data-lang-key="cssLabel">CSS</span></div>
                    <div class="action-buttons">
                        <button class="copy-btn" data-target="css" data-lang-key="copyBtn">📋 Copy</button>
                        <button class="clear-btn" data-editor="css" data-lang-key="clearButton">Clear</button>
                    </div>
                </div>
                <div class="editor-container"><textarea id="css-code" class="hidden"></textarea></div>
            </div>
            <!-- JavaScript Panel -->
            <div class="editor-panel bg-gray-800 rounded-sm">
                <div class="editor-header">
                    <div class="editor-label"><span class="text-yellow-400">{ }</span><span data-lang-key="jsLabel">JavaScript</span></div>
                    <div class="action-buttons">
                        <button class="copy-btn" data-target="js" data-lang-key="copyBtn">📋 Copy</button>
                        <button class="clear-btn" data-editor="js" data-lang-key="clearButton">Clear</button>
                    </div>
                </div>
                <div class="editor-container"><textarea id="js-code" class="hidden"></textarea></div>
            </div>
        </div>

        <div class="flex flex-col bg-gray-800 overflow-hidden">
            <div class="bg-gray-900 px-3 py-2 text-sm font-semibold text-gray-300 flex-shrink-0 border-b border-gray-700 flex justify-between items-center">
                <span data-lang-key="outputLabel">Output</span>
                <span class="text-xs text-gray-400">⚡ live preview</span>
            </div>
            <iframe id="output-frame" class="w-full h-full bg-white border-none" title="Output" sandbox="allow-same-origin allow-scripts allow-popups allow-forms" srcdoc="<html><body style='background:#fff; display:flex; align-items:center; justify-content:center; font-family:sans-serif;'>Loading preview...</body></html>"></iframe>
        </div>
    </main>

    <div id="toast" class="toast-msg"></div>

    <script>
        (function() {
            const STORAGE_KEYS = { html: 'proEditor_html', css: 'proEditor_css', js: 'proEditor_js', lang: 'proEditor_lang' };
            let htmlEditor, cssEditor, jsEditor, renderTimeout;
            const toast = document.getElementById('toast');
            const outputFrame = document.getElementById('output-frame');

            function showMessage(msg, isError = false) {
                toast.style.opacity = '1';
                toast.textContent = msg;
                toast.style.borderLeftColor = isError ? '#ef4444' : '#3b82f6';
                setTimeout(() => { toast.style.opacity = '0'; }, 1800);
            }

            const defaultCode = {
                html: `<div class="card"><div class="icon">✨</div><h1>Interactive Live Editor</h1><p>Edit HTML, CSS, and JavaScript in real-time. All changes are saved automatically.</p><button id="magicBtn">Click me</button><div id="outputMsg" class="message"></div></div>`,
                css: `body{background:linear-gradient(145deg,#0b1120,#111827);display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,'Inter',sans-serif;margin:0;padding:1.5rem}.card{background:rgba(15,25,45,0.8);backdrop-filter:blur(12px);border-radius:2rem;padding:2rem;text-align:center;box-shadow:0 25px 45px -12px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.15);max-width:550px;width:100%}.icon{font-size:3rem;margin-bottom:0.5rem}h1{font-size:1.8rem;margin-bottom:0.75rem;background:linear-gradient(120deg,#a5f3fc,#c084fc);background-clip:text;-webkit-background-clip:text;color:transparent}p{color:#cbd5e6;margin-bottom:1.5rem;line-height:1.5}button{background:#3b82f6;border:none;padding:0.7rem 1.8rem;border-radius:3rem;font-weight:600;color:white;cursor:pointer;transition:transform 0.2s,background 0.2s;font-size:0.9rem;box-shadow:0 4px 10px rgba(59,130,246,0.3)}button:hover{background:#2563eb;transform:scale(1.02)}.message{margin-top:1rem;font-size:0.9rem;color:#94a3b8}`,
                js: `document.getElementById('magicBtn')?.addEventListener('click',()=>{const msgDiv=document.getElementById('outputMsg');msgDiv.textContent='🎉 JavaScript is working! 🚀';msgDiv.style.color='#86efac';setTimeout(()=>{msgDiv.textContent=''},2000)});console.log('Live editor ready — syntax highlighting active!');`
            };

            function loadFromStorage() {
                return {
                    html: localStorage.getItem(STORAGE_KEYS.html) ?? defaultCode.html,
                    css: localStorage.getItem(STORAGE_KEYS.css) ?? defaultCode.css,
                    js: localStorage.getItem(STORAGE_KEYS.js) ?? defaultCode.js
                };
            }

            function saveAll() {
                localStorage.setItem(STORAGE_KEYS.html, htmlEditor.getValue());
                localStorage.setItem(STORAGE_KEYS.css, cssEditor.getValue());
                localStorage.setItem(STORAGE_KEYS.js, jsEditor.getValue());
            }

            function renderPreview() {
                clearTimeout(renderTimeout);
                renderTimeout = setTimeout(() => {
                    const html = htmlEditor.getValue();
                    const css = cssEditor.getValue();
                    const js = jsEditor.getValue();
                    const fullDoc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>${css}</style></head><body>${html}<script>${js}<\/script></body></html>`;
                    outputFrame.srcdoc = fullDoc;
                }, 150);
            }

            function updateClearButtons() {
                const htmlHas = htmlEditor.getValue().trim() !== '';
                const cssHas = cssEditor.getValue().trim() !== '';
                const jsHas = jsEditor.getValue().trim() !== '';
                document.querySelectorAll('.clear-btn').forEach(btn => {
                    const type = btn.getAttribute('data-editor');
                    let empty = (type === 'html' && !htmlHas) || (type === 'css' && !cssHas) || (type === 'js' && !jsHas);
                    btn.classList.toggle('disabled-clear', empty);
                });
            }

            function initEditors() {
                const saved = loadFromStorage();
                htmlEditor = CodeMirror.fromTextArea(document.getElementById('html-code'), { mode: 'htmlmixed', theme: 'material-darker', lineNumbers: true, lineWrapping: true, autoRefresh: true, tabSize: 2, placeholder: '<!-- HTML code -->' });
                htmlEditor.setValue(saved.html);
                cssEditor = CodeMirror.fromTextArea(document.getElementById('css-code'), { mode: 'css', theme: 'material-darker', lineNumbers: true, lineWrapping: true, autoRefresh: true, tabSize: 2, placeholder: '/* CSS styles */' });
                cssEditor.setValue(saved.css);
                jsEditor = CodeMirror.fromTextArea(document.getElementById('js-code'), { mode: 'javascript', theme: 'material-darker', lineNumbers: true, lineWrapping: true, autoRefresh: true, tabSize: 2, placeholder: '// JavaScript code' });
                jsEditor.setValue(saved.js);

                const onChange = () => { saveAll(); updateClearButtons(); renderPreview(); };
                htmlEditor.on('change', onChange);
                cssEditor.on('change', onChange);
                jsEditor.on('change', onChange);
                window.addEventListener('resize', () => [htmlEditor, cssEditor, jsEditor].forEach(ed => ed.refresh()));
            }

            function setupClearButtons() {
                document.querySelectorAll('.clear-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (btn.classList.contains('disabled-clear')) return;
                        const type = btn.getAttribute('data-editor');
                        if (type === 'html') htmlEditor.setValue('');
                        else if (type === 'css') cssEditor.setValue('');
                        else if (type === 'js') jsEditor.setValue('');
                        saveAll(); updateClearButtons(); renderPreview();
                        showMessage(`✨ ${type.toUpperCase()} cleared`);
                    });
                });
            }

            async function copyToClipboard(text, label) {
                try { await navigator.clipboard.writeText(text); showMessage(`📋 ${label} copied`); } catch { showMessage(`❌ Failed to copy ${label}`, true); }
            }

            function setupCopyButtons() {
                document.querySelectorAll('.copy-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const target = btn.getAttribute('data-target');
                        let code = '', label = '';
                        if (target === 'html') { code = htmlEditor.getValue(); label = 'HTML'; }
                        else if (target === 'css') { code = cssEditor.getValue(); label = 'CSS'; }
                        else { code = jsEditor.getValue(); label = 'JavaScript'; }
                        await copyToClipboard(code, label);
                    });
                });
            }

            function downloadHtml() {
                const html = htmlEditor.getValue(), css = cssEditor.getValue(), js = jsEditor.getValue();
                const blob = new Blob([`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Exported</title><style>${css}</style></head><body>${html}<script>${js}<\/script></body></html>`], { type: 'text/html' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'live_editor.html'; a.click(); URL.revokeObjectURL(a.href);
                showMessage('✅ Downloaded as HTML');
            }

            async function downloadZip() {
                const html = htmlEditor.getValue(), css = cssEditor.getValue(), js = jsEditor.getValue();
                try {
                    const zip = new JSZip();
                    zip.file("index.html", `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Project</title><link rel="stylesheet" href="style.css"></head><body>${html}<script src="script.js"><\/script></body></html>`);
                    zip.file("style.css", css); zip.file("script.js", js);
                    const blob = await zip.generateAsync({ type: "blob" });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'project.zip'; a.click(); URL.revokeObjectURL(a.href);
                    showMessage('✅ Downloaded as ZIP');
                } catch { showMessage('❌ ZIP failed', true); }
            }

            const translations = {
                en: { title: 'Live Code Editor Pro', htmlLabel: 'HTML', cssLabel: 'CSS', jsLabel: 'JavaScript', outputLabel: 'Output', downloadHtmlBtn: '⬇️ Download HTML', downloadZipBtn: '⬇️ Download ZIP', copyBtn: '📋 Copy', clearButton: 'Clear', htmlPlaceholder: '<!-- HTML -->', cssPlaceholder: '/* CSS */', jsPlaceholder: '// JS' },
                ar: { title: 'محرر الأكواد المباشر المحترف', htmlLabel: 'HTML', cssLabel: 'CSS', jsLabel: 'JavaScript', outputLabel: 'المعاينة', downloadHtmlBtn: '⬇️ تحميل HTML', downloadZipBtn: '⬇️ تحميل ZIP', copyBtn: '📋 نسخ', clearButton: 'مسح', htmlPlaceholder: '<!-- كود HTML -->', cssPlaceholder: '/* أنماط CSS */', jsPlaceholder: '// كود جافا سكريبت' },
                fr: { title: 'Éditeur Live Pro', htmlLabel: 'HTML', cssLabel: 'CSS', jsLabel: 'JavaScript', outputLabel: 'Aperçu', downloadHtmlBtn: '⬇️ Télécharger HTML', downloadZipBtn: '⬇️ Télécharger ZIP', copyBtn: '📋 Copier', clearButton: 'Effacer', htmlPlaceholder: '<!-- HTML -->', cssPlaceholder: '/* CSS */', jsPlaceholder: '// JS' },
                es: { title: 'Editor en Vivo Pro', htmlLabel: 'HTML', cssLabel: 'CSS', jsLabel: 'JavaScript', outputLabel: 'Vista previa', downloadHtmlBtn: '⬇️ Descargar HTML', downloadZipBtn: '⬇️ Descargar ZIP', copyBtn: '📋 Copiar', clearButton: 'Limpiar', htmlPlaceholder: '<!-- HTML -->', cssPlaceholder: '/* CSS */', jsPlaceholder: '// JS' },
                pt: { title: 'Editor Ao Vivo Pro', htmlLabel: 'HTML', cssLabel: 'CSS', jsLabel: 'JavaScript', outputLabel: 'Pré-visualização', downloadHtmlBtn: '⬇️ Baixar HTML', downloadZipBtn: '⬇️ Baixar ZIP', copyBtn: '📋 Copiar', clearButton: 'Limpar', htmlPlaceholder: '<!-- HTML -->', cssPlaceholder: '/* CSS */', jsPlaceholder: '// JS' },
                it: { title: 'Editor Live Pro', htmlLabel: 'HTML', cssLabel: 'CSS', jsLabel: 'JavaScript', outputLabel: 'Anteprima', downloadHtmlBtn: '⬇️ Scarica HTML', downloadZipBtn: '⬇️ Scarica ZIP', copyBtn: '📋 Copia', clearButton: 'Pulisci', htmlPlaceholder: '<!-- HTML -->', cssPlaceholder: '/* CSS */', jsPlaceholder: '// JS' }
            };

            function setLanguage(lang) {
                const data = translations[lang];
                if (!data) return;
                document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                document.querySelectorAll('[data-lang-key]').forEach(el => {
                    const key = el.dataset.langKey;
                    if (data[key]) { if (el.tagName === 'TEXTAREA') el.placeholder = data[key]; else el.textContent = data[key]; }
                });
                document.title = data.title;
                if (htmlEditor) htmlEditor.setOption('placeholder', data.htmlPlaceholder);
                if (cssEditor) cssEditor.setOption('placeholder', data.cssPlaceholder);
                if (jsEditor) jsEditor.setOption('placeholder', data.jsPlaceholder);
                localStorage.setItem(STORAGE_KEYS.lang, lang);
                document.getElementById('language-switcher').value = lang;
            }

            window.addEventListener('DOMContentLoaded', () => {
                initEditors();
                setupClearButtons();
                setupCopyButtons();
                document.getElementById('download-html-btn').onclick = downloadHtml;
                document.getElementById('download-zip-btn').onclick = downloadZip;
                const savedLang = localStorage.getItem(STORAGE_KEYS.lang) || 'en';
                setLanguage(savedLang);
                document.getElementById('language-switcher').addEventListener('change', e => setLanguage(e.target.value));
                renderPreview();
                updateClearButtons();

                // Optional PWA (Service Worker)
                if ('serviceWorker' in navigator) {
                    try {
                        const swCode = `const CACHE="editor-v2"; const urls=[location.pathname,"https://cdn.tailwindcss.com","https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css","https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css","https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js","https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js","https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js","https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js","https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js","https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/display/autorefresh.min.js","https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"]; self.addEventListener("install",e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(urls)))); self.addEventListener("fetch",e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
                        const blob = new Blob([swCode], {type: 'application/javascript'});
                        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(e=>console.log("SW not supported"));
                    } catch(e) {}
                }
            });
        })();
    </script>
</body>
</html>
